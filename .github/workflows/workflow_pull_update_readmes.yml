name: Update Readmes and Pull Repo Updates

on:
  schedule:
    # Poll MOFA twice an hour on off-peak minutes (GitHub delays :00 the most).
    # A poll that finds nothing new costs one API call and exits in seconds.
    - cron: '22,52 * * * *'
  workflow_dispatch:

concurrency:
  group: update-readmes
  cancel-in-progress: false

jobs:
  combined-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Check whether MOFA published anything new
      id: mofa
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Compare the git tree SHA of MOFA's latest_raw_files folder with the
        # one recorded at our last pull. One API call, no clone, no Python.
        remote="$(gh api repos/cocopuff2u/MOFA/git/trees/main \
          --jq '.tree[] | select(.path=="latest_raw_files") | .sha' || true)"
        local="$(cat repo_raw_data/mofa_tree_sha.txt 2>/dev/null || true)"
        echo "MOFA latest_raw_files tree: remote=${remote:-unknown} recorded=${local:-none}"
        if [ -n "$remote" ] && [ "$remote" = "$local" ]; then
          echo "MOFA unchanged since last pull. Nothing to do."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "MOFA has new data (or the check could not run). Doing a full update."
          [ -n "$remote" ] && echo "$remote" > repo_raw_data/mofa_tree_sha.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Python
      if: steps.mofa.outputs.changed == 'true'
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Install dependencies
      if: steps.mofa.outputs.changed == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install pytz
        pip install PyGitHub

    - name: Run pull_raw_files script
      if: steps.mofa.outputs.changed == 'true'
      run: python repo_raw_data/pull_raw_files.py

    - name: Commit and push changes
      if: steps.mofa.outputs.changed == 'true'
      env:
        TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m 'Automated update of raw files'
        git push https://cocopuff2u:$TOKEN@github.com/cocopuff2u/MOFA_WEBSITE.git main

    - name: Run update scripts
      if: steps.mofa.outputs.changed == 'true'
      run: |
        python update_readme_scripts/update_standalone_update_history_readme.py
        python update_readme_scripts/update_teams_update_history_readme.py
        python update_readme_scripts/update_standalone_pages.py
        python update_readme_scripts/update_standalone_cve_history_readme.py
        python update_readme_scripts/update_ios_appstore_current_version_readme.py
        python update_readme_scripts/update_macos_appstore_current_version_readme.py
        python update_readme_scripts/update_team.py
        python update_readme_scripts/update_standalone_current_version_simple.py
        python update_readme_scripts/update_macos_standalone_onedrive_readme.py
        python update_readme_scripts/update_macos_standalone_other_readme.py
        python update_readme_scripts/update_standalone_current_version_minimal.py
        python update_readme_scripts/update_ios_appstore_version_minimal.py
        python update_readme_scripts/update_macos_appstore_version_minimal.py

    - name: Copy macOS standalone RSS feeds
      if: steps.mofa.outputs.changed == 'true'
      run: |
        cp -a repo_raw_data/macos_standalone_rss/. docs/public/rss_feeds/

    - name: Commit README changes
      if: steps.mofa.outputs.changed == 'true'
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git status --short
        if [ -n "$(git status --porcelain)" ]; then
          git add docs/*.md docs/standalone_apps/*.md docs/macos_appstore/*.md docs/ios_appstore/*.md docs/public/rss_feeds/*.xml docs/about_support/*.md
          git commit -m 'Automated update of README files'
        else
          echo "No changes detected, skipping commit."
        fi

    - name: Push changes
      if: steps.mofa.outputs.changed == 'true'
      env:
        TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      run: |
        git push https://cocopuff2u:$TOKEN@github.com/cocopuff2u/mofa_website.git main
